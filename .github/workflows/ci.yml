name: CI
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lamanus
          POSTGRES_PASSWORD: lamanus_ci
          POSTGRES_DB: lamanus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lamanus" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lamanus:lamanus_ci@localhost:5432/lamanus?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # O download dos binários do Prisma pode falhar por rede (ECONNRESET).
      - name: npm ci com até 3 tentativas
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci falhou (tentativa $i)"; sleep $((i*10)); done; exit 1
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Exercita o caminho do README: PostgreSQL via Docker Compose + migração + seed.
  compose:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lamanus:lamanus_dev@localhost:5432/lamanus?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: docker compose up -d --wait db
      - name: npm ci com até 3 tentativas
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci falhou (tentativa $i)"; sleep $((i*10)); done; exit 1
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - name: Confirmar dados do seed
        run: docker compose exec -T db psql -U lamanus -d lamanus -tAc 'select count(*) from "Estudante"' | grep -qx 5
      - if: always()
        run: docker compose down -v
