name: CI
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lamanus
          POSTGRES_PASSWORD: lamanus_ci
          POSTGRES_DB: lamanus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lamanus" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Dono das tabelas (migrações, seed, limpeza de testes) e papel restrito da aplicação.
      ADMIN_DATABASE_URL: postgresql://lamanus:lamanus_ci@localhost:5432/lamanus?schema=public
      DATABASE_URL: postgresql://lamanus_app:lamanus_app_ci@localhost:5432/lamanus?schema=public
      AUTH_DATABASE_URL: postgresql://lamanus_auth:lamanus_auth_ci@localhost:5432/lamanus?schema=public
      SEED_PASSWORD: Ci-Apenas-Teste-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # O download dos binários do Prisma pode falhar por rede (ECONNRESET).
      - name: npm ci com até 3 tentativas
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci falhou (tentativa $i)"; sleep $((i*10)); done; exit 1
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Criar o papel restrito da aplicação
        run: PGPASSWORD=lamanus_ci psql -h localhost -U lamanus -d lamanus -v ON_ERROR_STOP=1 -v app_password=lamanus_app_ci -v auth_password=lamanus_auth_ci -f docker/db/papeis.sql
      - run: npm run db:preflight
      - run: npm run db:deploy
      - run: npm run verificar:privilegios
      - run: npm run db:seed
      - run: npm test
      # O pg_dump por omissão do corredor pode ser mais novo que o servidor (16) e escrever comandos que o 16 não conhece.
      - name: Cliente PostgreSQL 16 (o mesmo major do servidor)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Ensaio de restauro (cópia cifrada → base nova → comparar contagens)
        run: bash scripts/testar-restauro.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Exercita o caminho do README: PostgreSQL via Docker Compose (que cria o papel restrito) + migração + seed.
  compose:
    runs-on: ubuntu-latest
    env:
      ADMIN_DATABASE_URL: postgresql://lamanus:lamanus_dev@localhost:5432/lamanus?schema=public
      DATABASE_URL: postgresql://lamanus_app:lamanus_app_dev@localhost:5432/lamanus?schema=public
      AUTH_DATABASE_URL: postgresql://lamanus_auth:lamanus_auth_dev@localhost:5432/lamanus?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: docker compose up -d --wait db
      - name: npm ci com até 3 tentativas
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci falhou (tentativa $i)"; sleep $((i*10)); done; exit 1
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - name: Confirmar dados do seed
        run: docker compose exec -T db psql -U lamanus -d lamanus -tAc 'select count(*) from "Estudante"' | grep -qx 5
      - name: Confirmar que a aplicação NÃO tem poderes de dono (papel restrito)
        run: |
          app() { docker compose exec -T -e PGPASSWORD=lamanus_app_dev db psql -U lamanus_app -d lamanus -v ON_ERROR_STOP=1 -c "$1"; }
          # Cada comando abaixo TEM de ser recusado; se algum for aceite, o passo falha.
          for proibido in 'TRUNCATE "Nota"' 'ALTER TABLE "Nota" DISABLE TRIGGER nota_bloqueada' 'SET ROLE lamanus' 'DELETE FROM "EventoAuditoria"' \
            'SELECT * FROM "Session"' 'SELECT "passwordHash" FROM "User"' "UPDATE \"User\" SET estado = 'ACTIVO'" \
            'DELETE FROM "UserRole"' 'DELETE FROM "RolePermission"' "INSERT INTO \"EventoAuditoria\" (id, acao, entidade) VALUES (gen_random_uuid(), 'X', 'X')"; do
            if app "$proibido" >/dev/null 2>&1; then
              echo "ERRO: a aplicação conseguiu executar: $proibido"
              exit 1
            fi
            echo "recusado (correcto): $proibido"
          done
          app 'SELECT count(*) FROM "Nota"' >/dev/null
          # O módulo de autenticação (lamanus_auth) alcança as sessões mas não o negócio.
          auth() { docker compose exec -T -e PGPASSWORD=lamanus_auth_dev db psql -U lamanus_auth -d lamanus -v ON_ERROR_STOP=1 -c "$1"; }
          auth 'SELECT count(*) FROM "Session"' >/dev/null
          for proibido in 'SELECT count(*) FROM "Nota"' 'DELETE FROM "Session"' 'DELETE FROM "UserRole"'; do
            if auth "$proibido" >/dev/null 2>&1; then
              echo "ERRO: o papel de autenticação conseguiu executar: $proibido"
              exit 1
            fi
            echo "recusado (correcto, autenticação): $proibido"
          done
      - if: always()
        run: docker compose down -v

  # Valida que a imagem da aplicação constrói e contém o servidor autónomo (o Dockerfile não se constrói localmente).
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lamanus:ci .
      - name: A imagem corre sem privilégios e contém o servidor
        run: |
          docker run --rm --entrypoint sh lamanus:ci -c 'test -f server.js && test "$(id -u)" != 0'
          docker run --rm --entrypoint sh lamanus:ci -c 'test ! -f .env && ! ls /app | grep -qi "\.xlsx"'
