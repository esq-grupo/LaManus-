name: CI
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lamanus
          POSTGRES_PASSWORD: lamanus_ci
          POSTGRES_DB: lamanus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lamanus" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lamanus:lamanus_ci@localhost:5432/lamanus?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
